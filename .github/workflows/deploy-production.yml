name: Build and deploy production artifact
on:
  push:
    branches: [develop, codex/ci-artifact-deploy]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PUBLIC_BUILD_ENV_JSON: ${{ vars.PUBLIC_BUILD_ENV_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deployment failure and rollback behavior
        run: |
          bash -n deploy/package-release.sh deploy/receive-release.sh
          python3 deploy/test-receiver.py
      - name: Load public build configuration
        run: |
          bun -e '
          const env=JSON.parse(process.env.PUBLIC_BUILD_ENV_JSON || "{}");
          if (!env.NEXT_PUBLIC_APP_URL || !env.API_BASE_URL) throw Error("Missing public build configuration");
          for (const [key,value] of Object.entries(env)) {
            if (!/^(NEXT_PUBLIC_[A-Z0-9_]+|API_BASE_URL|ALLOW_INSECURE_HTTP|S3_PUBLIC_BASE_URL)$/.test(key) || typeof value !== "string" || /[\r\n]/.test(value)) throw Error("Invalid public build configuration");
            require("node:fs").appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }'
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bunx tsc --noEmit --incremental false
      - run: bun run test
      - run: bun run build
      - run: bash deploy/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: production-${{ github.sha }}
          path: release-artifact/*
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-${{ github.sha }}
          path: release-artifact
      - name: Deliver verified archive
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cd release-artifact
          sha256sum --check release.tar.gz.sha256
          digest=$(sha256sum release.tar.gz | cut -d ' ' -f 1)
          ssh -T -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $digest" < release.tar.gz
