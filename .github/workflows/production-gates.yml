name: Production gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-auth-secret-at-least-32-characters
      PAYMENT_WEBHOOK_SECRET: ci-payment-secret-at-least-32-characters
      OTP_HASH_SECRET: ci-otp-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx --bun prisma migrate deploy
      - run: bunx --bun prisma generate
      - run: bunx --bun prisma validate
      - run: bunx --bun prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run audit:i18n
      - run: bun audit --prod --audit-level=high
      - run: bun run build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: production
      PLAYWRIGHT_PRODUCTION: 'true'
      ALLOW_INSECURE_HTTP: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_e2e?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      TRUST_PROXY: 'true'
      BETTER_AUTH_SECRET: ci-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_ci_placeholder_at_least_20_chars
      EMAIL_FROM: Marketplace CI <ci@example.com>
      PAYMENT_WEBHOOK_SECRET: ci-payment-secret-at-least-32-characters
      PAYMENT_PROVIDER: gateway
      PAYMENT_MOCK_ENABLED: 'false'
      PAYMENT_CHECKOUT_BASE_URL: http://127.0.0.1:3999/checkout
      PAYMENT_CHECKOUT_SECRET: ci-checkout-secret-at-least-32-characters
      OTP_HASH_SECRET: ci-otp-secret-at-least-32-characters
      KYC_ENCRYPTION_KEY: ci-kyc-secret-at-least-32-characters
      UPLOAD_STORAGE: local
      LOCAL_UPLOAD_SECRET: ci-local-upload-secret-at-least-32-characters
      MANUAL_FINANCE_OPERATIONS_ACKNOWLEDGED: 'true'
      AFFILIATE_ENABLED: 'false'
      AI_SEARCH_ENABLED: 'false'
      PHONE_OTP_ENABLED: 'false'
      OPENAPI_ENABLED: 'false'
      QUEUE_SKIP_REDIS_VERSION_CHECK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx --bun playwright install --with-deps chromium firefox webkit
      - run: bun run build
      - run: bun run test:e2e

  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: marketplace:ci
